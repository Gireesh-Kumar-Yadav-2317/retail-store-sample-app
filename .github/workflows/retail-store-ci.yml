
name: Retail Store - Production CI

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retail-store-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate-source:
    name: Validate repository structure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate required Docker build files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            docker/ui/Dockerfile
            docker/cart/Dockerfile
            docker/orders/Dockerfile
            docker/catalog/Dockerfile
            docker/checkout/Dockerfile
            docker/load-generator/Dockerfile
            docker/.dockerignore
            docker/docker-compose.yaml
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required file is missing or empty: $file"
              exit 1
            fi

            echo "Validated: $file"
          done

          echo "All required Docker build files are present."

  validate-release:
    name: Validate production release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: startsWith(github.ref, 'refs/tags/')

    needs:
      - validate-source

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate semantic version
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            echo "Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Release version validated: $VERSION"

      - name: Verify release commit belongs to main
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor \
            "$GITHUB_SHA" refs/remotes/origin/main; then

            echo "::error::Release tag must point to a commit contained in main."
            exit 1
          fi

          echo "Release commit verified against main."

  secret-scan:
    name: Scan repository for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  discover-runtimes:
    name: Discover required runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - validate-source
      - secret-scan
    outputs:
      java-version: ${{ steps.detect.outputs.java_version }}
      go-version: ${{ steps.detect.outputs.go_version }}
      node-version: ${{ steps.detect.outputs.node_version }}

    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Detect project runtime versions
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ./scripts/ci/setup-runtimes.sh


  application-tests:
    name: Application Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    needs:
      - validate-source
      - secret-scan
      - discover-runtimes

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        if: needs.discover-runtimes.outputs.java-version != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.discover-runtimes.outputs.java-version }}
          cache: maven

      - name: Set up Go
        if: needs.discover-runtimes.outputs.go-version != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.discover-runtimes.outputs.go-version }}
          cache: true

      - name: Set up Node.js
        if: needs.discover-runtimes.outputs.node-version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.discover-runtimes.outputs.node-version }}

      - name: Enable Corepack
        if: needs.discover-runtimes.outputs.node-version != ''
        run: corepack enable

      - name: Verify installed runtimes
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -n "${{ needs.discover-runtimes.outputs.java-version }}" ]]; then
            java -version
            mvn -version
          fi

          if [[ -n "${{ needs.discover-runtimes.outputs.go-version }}" ]]; then
            go version
          fi

          if [[ -n "${{ needs.discover-runtimes.outputs.node-version }}" ]]; then
            node --version
            npm --version
          fi

      - name: Run application tests
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: |
          set -Eeuo pipefail
          bash ./scripts/ci/test-projects.sh

      - name: Upload application test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-test-reports
          path: |
            src/**/target/surefire-reports/**
            src/**/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7


  code-quality:
    name: Static code quality analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - validate-source
      - secret-scan
      - discover-runtimes
      - application-tests
    permissions:
      contents: read
    steps:
      - name: checkout Source code 
        uses: actions/checkout@v4

      - name: Set up Jave 
        if: needs.discover-runtimes.outputs.java-version != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.discover-runtimes.outputs.java-version }}

      - name: Set up Go
        if: needs.discover-runtimes.outputs.go-version != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.discover-runtimes.outputs.go-version }}

      - name: Set up Node.js
        if: needs.discover-runtimes.outputs.node-version != ''
        uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.discover-runtimes.outputs.node-version }}   

      - name: Run code quality checks
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ./scripts/ci/quality-checks.sh

  build-projects:
    name: Build application projects
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - discover-runtimes
      - application-tests
      - code-quality

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        if: needs.discover-runtimes.outputs.java-version != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.discover-runtimes.outputs.java-version }}

      - name: Set up Go
        if: needs.discover-runtimes.outputs.go-version != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.discover-runtimes.outputs.go-version }}

      - name: Set up Node.js
        if: needs.discover-runtimes.outputs.node-version != ''
        uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.discover-runtimes.outputs.node-version }}

      - name: Build discovered projects
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ./scripts/ci/build-projects.sh