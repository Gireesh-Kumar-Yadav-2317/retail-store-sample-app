
name: Retail Store - Production CI

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retail-store-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate-source:
    name: Validate repository structure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate required Docker build files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            docker/ui/Dockerfile
            docker/cart/Dockerfile
            docker/orders/Dockerfile
            docker/catalog/Dockerfile
            docker/checkout/Dockerfile
            docker/load-generator/Dockerfile
            docker/.dockerignore
            docker/docker-compose.yaml
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required file is missing or empty: $file"
              exit 1
            fi

            echo "Validated: $file"
          done

          echo "All required Docker build files are present."

  validate-release:
    name: Validate production release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: startsWith(github.ref, 'refs/tags/')

    needs:
      - validate-source

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate semantic version
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            echo "Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Release version validated: $VERSION"

      - name: Verify release commit belongs to main
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor \
            "$GITHUB_SHA" refs/remotes/origin/main; then

            echo "::error::Release tag must point to a commit contained in main."
            exit 1
          fi

          echo "Release commit verified against main."

  secret-scan:
    name: Scan repository for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  discover-runtimes:
    name: Discover required runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - validate-source
      - secret-scan
    outputs:
      java-version: ${{ steps.detect.outputs.java_version }}
      go-version: ${{ steps.detect.outputs.go_version }}
      node-version: ${{ steps.detect.outputs.node_version }}

    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Detect project runtime versions
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/ci/setup-runtimes.sh

  application-tests:
    name: Dynamic application tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - validate-source
      - secret-scan
      - discover-runtimes

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Install Java only when a Java project is discovered.
      - name: Set up Java
        if: needs.discover-runtimes.outputs.java-version != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.discover-runtimes.outputs.java-version }}

      # Install Go only when a Go project is discovered.
      - name: Set up Go
        if: needs.discover-runtimes.outputs.go-version != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.discover-runtimes.outputs.go-version }}

      # Install Node.js only when a Node.js project is discovered.
      - name: Set up Node.js
        if: needs.discover-runtimes.outputs.node-version != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.discover-runtimes.outputs.node-version }}

      - name: Verify installed runtimes
        shell: bash
        run: |
          set -Eeuo pipefail

          java -version 2>&1 || true
          go version 2>/dev/null || true
          node --version 2>/dev/null || true
          npm --version 2>/dev/null || true

      - name: Run dynamic project tests
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/ci/test-projects.sh

  code-quality:
    name: Static code quality analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - validate-source
      - secret-scan
      - discover-runtimes
      - application-tests
    permissions:
      contents: read
    steps:
      - name: checkout Source code 
        uses: actions/checkout@v4

      - name: Set up Jave 
        if: needs.discover-runtimes.outputs.java-version != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.discover-runtimes.outputs.java-version }}

      - name: Set up Go
        if: needs.discover-runtimes.outputs.go-version != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.discover-runtimes.outputs.go-version }}

      - name: Set up Node.js
        if: needs.discover-runtimes.outputs.node-version != ''
        uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.discover-runtimes.outputs.node-version }}   

      - name: Run code quality checks
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/ci/quality-checks.sh